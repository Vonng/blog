# The home page, both languages in one file.
#
# Everything the home page shows is configured here — the hero copy, the column
# cards, the project and publication grids, and the closing call to action.
# The one exception is the `recent` section, which lists the newest posts
# straight from the content tree; only its heading and its two taxonomy
# buttons are data.
#
# Section entries name a partial under layouts/_partials/landing/sections/ when
# the theme has no section of that shape. Everything else is an OINK landing
# section: https://oink.pgsty.com/docs/customize/home/

zh-cn:
  sections:
    - type: hero
      partial: landing/sections/hero-featured.html
    - type: cards
      key: columns
      partial: landing/sections/column-cards.html
    - type: cards
      key: recent
      partial: landing/sections/recent-posts.html
    - type: cards
      key: project
      partial: landing/sections/link-cards.html
    - type: cards
      key: publication
      partial: landing/sections/link-cards.html
    - cta

  hero:
    eyebrow: 冯若航 · 数据库老司机 · 云计算泥石流
    title: 老冯云数
    lead: >-
      [冯若航](/about/)（[@Vonng](https://github.com/Vonng)）：[Pigsty](https://pigsty.cc/) 作者，
      [PGSTY](https://pgsty.com/zh) 创始人，[活跃](https://committers.top/china)[开源贡献者](https://gitstar-ranking.com/Vonng)。<br>
      [数据库老司机](/db/)，[云计算泥石流](/cloud/)，[PostgreSQL 大法师](/pg/)，[AI Agent 探路者](/ai/)。
    portrait: img/about/vonng.jpg
    portrait_alt: 冯若航

  columns:
    eyebrow: 专栏
    columns: 3
    unit: 篇
    items:
      - page: /db
        title: 数据库老司机
        desc: 数据库行业的动态、新闻、调查、理念与最佳实践。
      - page: /cloud
        title: 云计算泥石流
        desc: 云计算、下云与基础设施自建的深度思考与成本分析。
      - page: /ai
        title: Agent 探路者
        desc: 关于 AI、Agent、LLM，以及 AI 与数据库之间的一切。
      - page: /pg
        title: Postgres 大法师
        desc: PostgreSQL 生态进展，以及开发、运维、诊断与调优的经验。
      - page: /trip
        title: 行万里路
        desc: 旅行、徒步与、游记与见闻。山川湖海，风物人情。
      - page: /misc
        title: 人生旅途
        desc: 随笔与杂谈，闲杂记录，也许与技术有关，或者完全无关。

  recent:
    eyebrow: 最新文章
    limit: 12
    columns: 3
    more:
      - { label: 按标签浏览, url: tags/, icon: fa-solid fa-tags }
      - { label: 按作者浏览, url: authors/, icon: fa-solid fa-user-pen }

  project:
    eyebrow: 开源项目
    columns: 3
    items:
      - title: Pigsty
        meta: 开源 PG RDS 发行版
        image: img/works/pigsty.cc.webp
        desc: 开箱即用的 PostgreSQL 数据库发行版，本地优先的 FLOSS RDS。
        url: 'https://pigsty.cc'
        external: true
      - title: SILO
        meta: S3 兼容对象存储
        image: img/works/silo.pgsty.com.webp
        desc: 社区维护的 MinIO 分支，延续 S3 兼容对象存储的开源版本。
        url: 'https://silo.pgsty.com'
        external: true
      - title: OINK
        meta: Hugo 文档主题
        image: img/works/oink.pgsty.com.webp
        desc: 本地优先的 Hugo 工程文档主题，也就是这个站点用的框架。
        url: 'https://oink.pgsty.com'
        external: true
      - title: PIG
        meta: PG 包管理器
        image: img/works/pig.pgsty.com.webp
        desc: 一条命令装上任意 PostgreSQL 扩展，覆盖 EL / Debian / Ubuntu。
        url: 'https://pig.pgsty.com'
        external: true
      - title: SOW
        meta: 软件仓库管理器
        image: img/works/sow.pgsty.com.webp
        desc: 一次入库，处处分发 —— APT 与 YUM 软件仓库的构建与镜像。
        url: 'https://sow.pgsty.com'
        external: true
      - title: PG Exporter
        meta: 监控指标采集
        image: img/works/exp.pgsty.com.webp
        desc: 用 SQL 表达的 PostgreSQL 可观测性，600+ 指标，声明式采集器。
        url: 'https://exp.pgsty.com'
        external: true
      - title: CapsLock 补完计划
        meta: 键盘改造
        image: img/works/caps.vonng.com.webp
        desc: 把没什么用的大写锁定键，变成第五个修饰键。
        url: 'https://caps.vonng.com/zh'
        external: true
      - title: PGEXT.CLOUD
        meta: PostgreSQL 扩展目录
        image: img/works/ext.pgsty.com.webp
        desc: 2200+ PostgreSQL 扩展的索引、目录与元数据，以及 570+ 扩展的下载、安装与构建矩阵。
        url: 'https://ext.pgsty.com'
        external: true
      - title: PGSTY
        meta: 公司主页
        image: img/works/pgsty.com.webp
        desc: Pigsty 背后的团队，以及围绕它的开源与服务。
        url: 'https://pgsty.com/zh'
        external: true

  publication:
    eyebrow: 译作与著述
    columns: 3
    items:
      - title: DDIA
        meta: 中文翻译本
        image: img/works/ddia.vonng.com.webp
        desc: 《设计数据密集型应用》中文版，分布式系统的必读经典。

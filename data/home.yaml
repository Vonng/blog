        external: true
      - title: PostgreSQL 内幕探索
        meta: 中文翻译本
        image: img/works/pgint.vonng.com.webp
        desc: 《PostgreSQL Internals》中文版，讲述 PostgreSQL 内核原理。
        url: 'https://pgint.vonng.com'
        external: true
      - title: pg.center
        meta: PostgreSQL 官网中文版
        image: img/works/pg.center.webp
        desc: postgresql.org 的完整中文镜像，含 PG 18 中文文档。
        url: 'https://pg.center'
        external: true
      - title: pgsql.cc
        meta: PG 运维文库
        image: img/works/pgsql.cc.webp
        desc: PostgreSQL 与周边组件的中英文运维文档聚合站。
        url: 'https://pgsql.cc'
        external: true
      - title: D-Bot
        meta: VLDB 论文
        image: img/works/dbot.jpg
        desc: Database Diagnosis System using Large Language Models，VLDB 2024。
        url: 'https://www.vldb.org/pvldb/vol17/p2514-li.pdf'
        external: true
      - title: hbase_fdw
        meta: NPC 2017 论文
        image: img/works/hbase_fdw.webp
        desc: 用 PostgreSQL FDW 为异构数据库构建统一访问层。
        url: 'https://dl.acm.org/doi/10.1007/978-3-319-68210-5_14'
        external: true
      - title: 赛博经藏
        meta: Cyber Dharma
        image: img/works/dharma.vonng.com.webp
        desc: 七种传统绕着一台机器旋转 —— 关于技术与信仰的札记。
        url: 'https://dharma.vonng.com'
        external: true
      - title: 人工智能帝国
        meta: 中文翻译本
        image: img/works/aiempire.vonng.com.webp
        desc: Karen Hao《Empire of AI》中文版，山姆·奥特曼的 OpenAI：梦想与梦魇。
        url: 'https://aiempire.vonng.com'
        external: true
      - title: 产品思维工程师
        meta: 中文翻译本
        image: img/works/tpme.vonng.com.webp
        desc: 《The Product-Minded Engineer》中文版。
        url: 'https://tpme.vonng.com'
        external: true

  cta:
    title: 有问题，或者想聊聊？
    text: 欢迎在任何一篇文章下留言，也可以订阅 RSS，或者直接找我。
    actions:
      - { label: 关于我, url: about/, icon: fa-solid fa-circle-user, style: primary }

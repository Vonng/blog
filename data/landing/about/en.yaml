bio:
  eyebrow: Introduction
  title: Who I am, and what I work on
  body: |
    I am **Ruohang Feng**, generally known online as **Vonng**. I build databases,
    I run databases, and I write about databases.

    In 2018 I started [**Pigsty**](https://pigsty.io) — a battery-included open
    source PostgreSQL distribution. It packages high availability, point-in-time
    recovery, connection pooling, a full monitoring stack and four hundred-odd
    extensions into an RDS you can run yourself, so that anyone can have
    cloud-database capability on their own servers without paying the cloud premium.

    Before that I worked as an architect, DBA and full-stack engineer at
    **Alibaba**, **TanTan** and **Apple**, where I ran hundreds of PostgreSQL
    clusters and made most of the mistakes worth making.

    Outside of work I translated [**DDIA**](https://ddia.vonng.com) (*Designing
    Data-Intensive Applications*) and [**PostgreSQL
    Internals**](https://pgint.vonng.com) into Chinese, maintain
    [**pg_exporter**](https://pigsty.io/docs/pg_exporter) and a handful of other
    open source tools, and keep writing here.

    I also hike, travel and play games. Those show up in
    [Travel Notes](trip/) and [Miscellaneous](misc/).


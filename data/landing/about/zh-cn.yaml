bio:
  eyebrow: 简介
  title: 我是谁，我在做什么
  body: |
    我叫**冯若航**，在网上一般叫 **Vonng**。我做数据库，写数据库，也写关于数据库的文章。

    2018 年我开始做 [**Pigsty**](https://pigsty.cc) —— 一个开箱即用的开源 PostgreSQL 发行版。
    它把高可用、时间点恢复、连接池、监控系统与四百多个扩展插件打包成一套可以自己跑起来的
    RDS，让任何人都能在自己的服务器上获得云数据库级别的能力，而不必支付云上的溢价。

    在此之前，我是架构师、DBA 与全栈工程师，先后在 **Alibaba**、**TanTan** 与 **Apple**
    工作，管理过数百套 PostgreSQL 集群，也踩过足够多的坑。

    工作之外，我翻译了 [**DDIA**](https://ddia.vonng.com)（《设计数据密集型应用》）与
    [**PostgreSQL 内幕探索**](https://pgint.vonng.com) 的中文版，维护
    [**pg_exporter**](https://pigsty.io/docs/pg_exporter) 等一系列开源工具，
    并在公众号《老冯云数》与这个博客上持续写作。

    我也徒步、旅行、打游戏。这些东西同样会出现在[行万里路](trip/)与[闲言随笔](misc/)里。


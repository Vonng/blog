        - { identifier: column-pigsty, parent: column, name: Pigsty Releases, pageRef: /pigsty, weight: 50, params: { icon: 'fa-solid fa-rocket', description: 'Release notes for the open-source PostgreSQL RDS distribution' } }
        - { identifier: column-trip, parent: column, name: Travel Notes, pageRef: /trip, weight: 60, params: { icon: 'fa-solid fa-person-hiking', description: 'Trips, hikes and things seen along the way' } }
        - { identifier: column-misc, parent: column, name: Miscellaneous, pageRef: /misc, weight: 70, params: { icon: 'fa-solid fa-feather', description: 'Essays, notes and miscellaneous writing' } }
        - { identifier: column-tags, parent: column, name: Tags, pageRef: /tags, weight: 80, params: { icon: 'fa-solid fa-tags', description: 'Browse every article by tag' } }
        - { identifier: column-authors, parent: column, name: Authors, pageRef: /authors, weight: 90, params: { icon: 'fa-solid fa-user-pen', description: 'The writers behind the originals and the translations' } }

